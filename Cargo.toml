[package]
name = "bevy_penumbra"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Sparse world-space Split Radiance Cascades diffuse global illumination for Bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "global-illumination", "radiance-cascades", "slang"]
categories = ["game-development", "graphics", "rendering"]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["3d_bevy_render", "bevy_log"] }
bevy_slang = { version = "0.1.0", path = "../bevy_slang" }

[dev-dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["3d", "png"] }
naga = { version = "29", features = ["wgsl-in"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
missing_docs = "warn"
